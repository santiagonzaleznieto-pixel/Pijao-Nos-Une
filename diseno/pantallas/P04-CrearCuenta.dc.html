<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>P-04 Crear cuenta con código</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pijaonosune/tokens.css">
<link rel="stylesheet" href="ds/pijaonosune/components/bundle.css">
<link rel="stylesheet" href="pantallas.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1d4e9e}a:hover{color:#122b52}
</style>
</helmet>
<div class="pj pantalla" data-theme="light">
  <div class="cabecera">
    <a href="Main.dc.html" class="atras pj-toque" aria-label="Volver"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1>Crear cuenta</h1>
  </div>
  <div style="padding: 0 18px 4px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span class="pj-etiqueta">PASO 1 DE 3</span>
      <span class="apoyo">Sus datos</span>
    </div>
    <div class="pj-pasos__barra" aria-hidden="true"><div class="pj-pasos__lleno pj-degradado" style="transform: scaleX(0.333)"></div></div>
  </div>
  <div class="cuerpo" style="padding-top: 18px; gap: 18px">
    <div class="pj-campo">
      <label for="codigo">Código de invitación</label>
      <input id="codigo" value="PJN4-7KQ2-XW9D" class="pj-num" autocomplete="off" style="font: 700 20px/24px var(--font-titulos); letter-spacing: 0.08em">
      <span class="pj-campo__ayuda" style="display: flex; gap: 6px; align-items: center; color: var(--texto-verde); font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>Código válido. Vence en 2 días.</span>
    </div>
    <div class="pj-campo">
      <label for="nombre">Nombres y apellidos</label>
      <input id="nombre" value="Carolina Ríos Arango" autocomplete="name">
    </div>
    <div class="pj-campo">
      <label for="celular">Celular</label>
      <input id="celular" value="300 456 7812" inputmode="tel" class="pj-num" autocomplete="tel">
    </div>
    <div class="pj-campo">
      <label for="correo">Correo</label>
      <input id="correo" value="carolina.rios@gmail.com" inputmode="email" autocomplete="email">
      <span class="pj-campo__ayuda">Debe ser el mismo de la invitación.</span>
    </div>
  </div>
  <div class="pie">
    <a href="P05-Acuerdos.dc.html" class="pj-boton pj-boton--solido pj-boton--ancho pj-toque" style="text-decoration: none">Continuar</a>
    <p class="apoyo" style="text-align: center">Después: foto, contacto de emergencia y declaración.</p>
  </div>
</div>
</x-dc>

</body>
</html>

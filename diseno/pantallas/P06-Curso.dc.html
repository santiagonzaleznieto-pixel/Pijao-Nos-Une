<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>P-06 Curso de ingreso</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pijaonosune/tokens.css">
<link rel="stylesheet" href="ds/pijaonosune/components/bundle.css">
<link rel="stylesheet" href="pantallas.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1d4e9e}a:hover{color:#122b52}
</style>
</helmet>
<div class="pj pantalla" data-theme="light">
  <div class="cabecera">
    <h1 style="padding-left: 8px">Curso de ingreso</h1>
    <span class="apoyo" style="padding-right: 10px">4 min</span>
  </div>
  <div style="padding: 0 18px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px" aria-label="Lección 3 de 7">
    <span style="height: 6px; border-radius: 3px; background: var(--marca-azul)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--marca-azul)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--marca-turquesa)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--superficie-panel)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--superficie-panel)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--superficie-panel)"></span>
    <span style="height: 6px; border-radius: 3px; background: var(--superficie-panel)"></span>
  </div>
  <div class="cuerpo" style="padding-top: 18px; gap: 18px">
    <div style="position: relative; height: 188px; border-radius: var(--radio-seccion); background: var(--tinte-turquesa); overflow: hidden" aria-hidden="true">
      <svg width="354" height="188" viewBox="0 0 354 188" fill="none" style="position: absolute; inset: 0">
        <path d="M0 150 C70 118 120 136 180 114 S300 80 354 104 L354 188 L0 188 Z" fill="var(--tinte-verde)"></path>
        <path d="M0 150 C70 118 120 136 180 114 S300 80 354 104" stroke="var(--marca-verde)" stroke-width="2"></path>
        <circle cx="290" cy="46" r="20" fill="var(--marca-naranja)"></circle>
        <rect x="112" y="70" width="98" height="70" rx="6" fill="#ffffff" stroke="var(--marca-azul)" stroke-width="2.5"></rect>
        <path d="M104 74 L161 34 L218 74" stroke="var(--marca-azul)" stroke-width="2.5" stroke-linejoin="round" fill="var(--tinte-naranja)"></path>
        <rect x="150" y="104" width="22" height="36" rx="3" fill="var(--tinte-azul)" stroke="var(--marca-azul)" stroke-width="2.5"></rect>
        <circle cx="244" cy="118" r="10" fill="var(--marca-azul)"></circle>
        <path d="M234 152 v-14 a10 10 0 0 1 20 0 v14" fill="var(--marca-azul)"></path>
      </svg>
    </div>
    <div>
      <p class="pj-etiqueta">LECCIÓN 3 DE 7</p>
      <h2 class="titulo-medio" style="margin-top: 6px">Una visita respetuosa</h2>
    </div>
    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; font: 400 16px/24px var(--font-texto); color: var(--tinta)">
      <li style="display: flex; gap: 12px"><span style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--tinte-azul); color: var(--texto-azul); font: 700 13px/26px var(--font-titulos); text-align: center">1</span>Salude, diga su nombre y el de la campaña, y explique para qué visita.</li>
      <li style="display: flex; gap: 12px"><span style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--tinte-azul); color: var(--texto-azul); font: 700 13px/26px var(--font-titulos); text-align: center">2</span>Pregunte si puede registrar la visita y ofrezca el aviso de privacidad.</li>
      <li style="display: flex; gap: 12px"><span style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--tinte-azul); color: var(--texto-azul); font: 700 13px/26px var(--font-titulos); text-align: center">3</span>Si le dicen que no, agradezca y deje constancia. No insista.</li>
    </ul>
  </div>
  <div class="pie" style="flex-direction: row">
    <button type="button" class="pj-boton pj-boton--suave pj-toque" style="flex: 1">Anterior</button>
    <button type="button" class="pj-boton pj-boton--solido pj-toque" style="flex: 2">Siguiente lección</button>
  </div>
</div>
</x-dc>

</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>P-12 Visita · autorización</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pijaonosune/tokens.css">
<link rel="stylesheet" href="ds/pijaonosune/components/bundle.css">

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1d4e9e}a:hover{color:#122b52}
</style>
</helmet>
<div class="pj pantalla" data-theme="light">
  <div class="cabecera">
    <a href="P12-Resultado.dc.html" class="atras pj-toque" aria-label="Guardar y salir"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10"></path><path d="M17 7L7 17"></path></svg></a>
    <h1>Nueva visita</h1>
    <span class="apoyo" style="padding-right: 12px">Borrador guardado</span>
  </div>
  <div style="padding: 0 18px 4px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span class="pj-etiqueta">PASO 10 DE 12</span>
      <span class="apoyo">Autorización</span>
    </div>
    <div class="pj-pasos__barra" aria-hidden="true"><div class="pj-pasos__lleno pj-degradado" style="transform: scaleX(0.833)"></div></div>
  </div>
  <div class="cuerpo" style="padding-top: 14px; gap: 12px">
    <div style="display: flex; gap: 8px" role="group" aria-label="Persona que autoriza">
      <button type="button" class="pj-chip pj-toque" aria-pressed="true">María Fernanda R.</button>
      <button type="button" class="pj-chip pj-toque" aria-pressed="false">Jorge Iván R.</button>
    </div>
    <div style="background: var(--superficie); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span class="texto-fuerte">Texto de autorización</span>
        <span class="pj-insignia pj-num" style="background: var(--fondo); color: var(--tinta-suave); padding: 2px 10px">v1-borrador</span>
      </div>
      <p style="margin: 0; font: 400 15px/23px var(--font-texto); color: var(--tinta)">Autorizo a la campaña Pijao Nos Une a tratar mis datos para conocer las necesidades de mi sector, según la política de tratamiento…</p>
      <a href="#" class="enlace" style="padding: 0">Leer completo en voz alta</a>
    </div>
    <label class="pj-casilla" style="padding: 12px 14px"><input type="checkbox" checked><span><strong>Mis datos personales</strong>Para conocer las necesidades de mi sector.</span></label>
    <label class="pj-casilla" style="padding: 12px 14px"><input type="checkbox" checked><span><strong>Que me contacten por WhatsApp</strong>Con información de la campaña.</span></label>
    <label class="pj-casilla" style="padding: 12px 14px"><input type="checkbox"><span><strong>Mi simpatía política</strong>Dato sensible: solo si la persona lo cuenta y lo autoriza.</span></label>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span class="texto-fuerte" style="font-size: 15px">Firma en la pantalla</span>
      <div style="position: relative; height: 92px; border-radius: var(--radio-control); border: 1.5px dashed var(--borde-control); background: var(--fondo)">
        <svg aria-label="Firma de María Fernanda R." role="img" width="352" height="92" viewBox="0 0 352 92" fill="none" style="position: absolute; inset: 0">
          <path d="M40 62 C52 30 62 28 66 48 S78 70 92 44 S112 22 118 50 C122 66 134 64 146 42 C156 26 168 30 170 50 S190 66 210 40 C222 26 236 34 240 52" style="stroke: var(--tinta)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M30 74 H322" style="stroke: var(--borde)" stroke-width="1.5"></path>
        </svg>
        <button type="button" class="pj-toque" style="position: absolute; right: 6px; top: 6px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--superficie); color: var(--tinta); font: 600 13px var(--font-titulos)">Borrar</button>
      </div>
    </div>
  </div>
  <div class="pie" style="flex-direction: row">
    <button type="button" class="pj-boton pj-boton--suave pj-toque" style="flex: 1">Atrás</button>
    <button type="button" class="pj-boton pj-boton--solido pj-toque" style="flex: 2">Siguiente</button>
  </div>
</div>
</x-dc>

<!-- @dsCard group="Campo" height=440 -->
<div class="pj" style="padding: 18px; display: flex; flex-direction: column; gap: 14px">
  <div class="pj-camara" role="img" aria-label="Visor de la cámara apuntando a una fachada">
    <svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 354 300" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0">
      <rect width="354" height="300" fill="#2b3a31"></rect>
      <path d="M50 150 L177 70 L304 150 Z" fill="#7a4b33"></path>
      <rect x="72" y="148" width="210" height="110" fill="#d8cdb8"></rect>
      <rect x="160" y="190" width="34" height="68" fill="#5b3a28"></rect>
      <rect x="96" y="170" width="40" height="34" fill="#8fb3c4"></rect>
      <rect x="218" y="170" width="40" height="34" fill="#8fb3c4"></rect>
      <rect y="258" width="354" height="42" fill="#4c5e42"></rect>
    </svg>
    <div class="pj-camara__guia" aria-hidden="true"></div>
    <span class="pj-camara__aviso" id="aviso">Encuadre toda la fachada</span>
    <div class="pj-camara__sello">PIJAO NOS UNE · 07/11/2026 10:41 a. m. · 4.3334, -75.7045 · ±7 m</div>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between">
    <button type="button" class="pj-boton pj-boton--suave pj-toque" style="min-height: 48px; padding: 0 16px">Sin foto</button>
    <button type="button" class="pj-disparador pj-toque" id="disparo" aria-label="Tomar foto"></button>
    <span style="width: 96px; text-align: right; font: 500 13px/18px var(--font-texto); color: var(--tinta-suave)" id="estado">0 de 1</span>
  </div>
</div>
<script>
document.getElementById('disparo').onclick = () => {
  document.getElementById('aviso').textContent = 'Foto tomada y sellada';
  document.getElementById('estado').textContent = '1 de 1';
};
</script>

<!-- @dsCard group="Formularios" height=330 -->
<div class="pj" style="padding: 18px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; justify-content: space-between; align-items: baseline">
    <span style="font: 600 15px/20px var(--font-titulos)">Firma de María Fernanda R.</span>
    <span id="estado" style="font: 500 13px/18px var(--font-texto); color: var(--tinta-suave)">Sin firmar</span>
  </div>
  <div class="pj-firma" id="caja">
    <canvas id="lienzo" aria-label="Lienzo de firma: firme con el dedo" role="img"></canvas>
    <div class="pj-firma__linea" aria-hidden="true"></div>
    <div class="pj-firma__vacio" id="vacio">Firme aquí con el dedo</div>
  </div>
  <div style="display: flex; gap: 10px">
    <button type="button" class="pj-boton pj-boton--suave pj-toque" id="borrar" style="flex: 1">Borrar</button>
    <button type="button" class="pj-boton pj-boton--solido pj-toque" id="aceptar" style="flex: 2" disabled>Aceptar firma</button>
  </div>
</div>
<script>
const lienzo = document.getElementById('lienzo'), caja = document.getElementById('caja');
const ctx = lienzo.getContext('2d');
let trazando = false, hay = false;
function ajustar() {
  const r = lienzo.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  lienzo.width = r.width * d; lienzo.height = r.height * d; ctx.scale(d, d);
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--tinta').trim() || '#122b52';
}
ajustar();
const punto = (e) => { const r = lienzo.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
lienzo.addEventListener('pointerdown', (e) => { trazando = true; lienzo.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...punto(e)); });
lienzo.addEventListener('pointermove', (e) => {
  if (!trazando) return;
  ctx.lineTo(...punto(e)); ctx.stroke();
  if (!hay) { hay = true; document.getElementById('vacio').hidden = true; document.getElementById('aceptar').disabled = false; document.getElementById('estado').textContent = 'Firmando…'; }
});
lienzo.addEventListener('pointerup', () => { trazando = false; });
document.getElementById('borrar').onclick = () => {
  ctx.clearRect(0, 0, lienzo.width, lienzo.height); hay = false; caja.classList.remove('pj-firma--firmada');
  document.getElementById('vacio').hidden = false; document.getElementById('aceptar').disabled = true; document.getElementById('estado').textContent = 'Sin firmar';
};
document.getElementById('aceptar').onclick = () => { caja.classList.add('pj-firma--firmada'); document.getElementById('estado').textContent = 'Firma guardada · 10:44 a. m.'; };
</script>

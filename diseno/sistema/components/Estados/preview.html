<div class="pj" style="padding: 18px; display: flex; flex-direction: column; gap: 14px; min-height: 100%">

  <div class="pj-seccion pj-vacio"><span class="pj-vacio__icono" style="color: var(--texto-rojo)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg></span><strong style="font: 700 17px/24px var(--font-titulos)">No se pudo cargar</strong><button type="button" class="pj-boton pj-boton--contorno pj-toque"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path><path d="M3 21v-5h5"></path></svg> Reintentar</button></div>
  <div class="pj-seccion pj-vacio" style="grid-column: 1 / -1"><span class="pj-vacio__icono"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span><strong style="font: 700 17px/24px var(--font-titulos)">Esta sección necesita un permiso</strong><span style="font: 400 15px/22px var(--font-texto); color: var(--tinta-suave)">Pídale al Director el permiso «Ver datos completos».</span></div>
</div>

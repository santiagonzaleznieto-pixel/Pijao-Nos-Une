<style>

.escena { position: relative; width: 180px; height: 180px; }
.arco { stroke-dasharray: 100; stroke-dashoffset: 100; animation: e-traza 600ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
.llega { animation: e-llega 1s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both; }
.linea { display: block; overflow: hidden; }
.linea > span { display: block; animation: e-sube 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
.mensaje { animation: e-aparece 0.6s cubic-bezier(0.22, 1, 0.36, 1) 2.1s both; }
.trazo { transform-origin: center; animation: e-crece 0.9s cubic-bezier(0.22, 1, 0.36, 1) 2.25s both; }
@keyframes e-traza { to { stroke-dashoffset: 0; } }
@keyframes e-llega { 0% { opacity: 0; transform: translateX(-160px) rotate(-16deg) scale(0.82); } 62% { opacity: 1; transform: translateX(8px) rotate(2deg) scale(1.02); } 100% { opacity: 1; transform: none; } }
@keyframes e-sube { from { transform: translateY(108%); } to { transform: none; } }
@keyframes e-aparece { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes e-crece { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .arco, .llega, .linea > span, .mensaje, .trazo { animation-duration: 150ms !important; animation-delay: 0s !important; transform: none !important; } }

</style>
<div class="pj" style="padding: 18px; display: flex; flex-direction: column; gap: 14px; min-height: 100%">

<div id="caja" style="display: flex; flex-direction: column; align-items: center; padding: 10px 0">
  <div class="escena">
    <svg aria-hidden="true" width="180" height="180" viewBox="0 0 220 220" fill="none" style="position: absolute; inset: 0">
      <path class="arco" pathLength="100" d="M115.02 14.13 A96 96 0 0 1 205.87 104.98" stroke="var(--marca-azul)" stroke-width="6" stroke-linecap="round" style="animation-delay: 0.05s"></path>
      <path class="arco" pathLength="100" d="M205.87 115.02 A96 96 0 0 1 115.02 205.87" stroke="var(--marca-turquesa)" stroke-width="6" stroke-linecap="round" style="animation-delay: 0.2s"></path>
      <path class="arco" pathLength="100" d="M104.98 205.87 A96 96 0 0 1 14.13 115.02" stroke="var(--marca-verde)" stroke-width="6" stroke-linecap="round" style="animation-delay: 0.35s"></path>
      <path class="arco" pathLength="100" d="M14.13 104.98 A96 96 0 0 1 104.98 14.13" stroke="var(--marca-naranja)" stroke-width="6" stroke-linecap="round" style="animation-delay: 0.5s"></path>
    </svg>
    <div class="llega" style="position: absolute; left: 29px; top: 29px; width: 122px; height: 122px; border-radius: 50%; overflow: hidden; background: #fff; box-shadow: var(--sombra-logo)">
      <img src="/_blob/36dcb5118a7c15daa80dbc75a9529024" alt="" style="position: absolute; width: 149px; height: 149px; left: -14px; top: -11px">
    </div>
  </div>
  <div role="img" aria-label="Pijao Nos Une" style="display: flex; flex-direction: column; align-items: center; font-family: var(--font-titulos); line-height: 1; margin-top: 22px">
    <span class="linea"><span class="pj-marca-texto" style="font-size: 38px; font-weight: 900; animation-delay: 1.1s">PIJAO</span></span>
    <span class="linea"><span style="font-size: 16px; font-weight: 600; letter-spacing: 0.32em; color: var(--tinta); margin: 5px 0 3px 0.32em; animation-delay: 1.22s">NOS</span></span>
    <span class="linea"><span class="pj-marca-texto" style="font-size: 38px; font-weight: 900; animation-delay: 1.34s">UNE</span></span>
  </div>
  <div class="trazo pj-degradado" aria-hidden="true" style="width: 100px; height: 3px; border-radius: 2px; margin-top: 16px"></div>
  <p class="mensaje" style="margin: 12px 0 0; font: 600 15px/20px var(--font-titulos); letter-spacing: 0.04em; color: var(--tinta-suave)">Juntos, casa por casa.</p>
</div>
<button type="button" class="pj-boton pj-boton--suave pj-toque" id="otra" style="align-self: center">Ver otra vez</button>

</div>
<script>

document.getElementById('otra').onclick = () => {
  const caja = document.getElementById('caja');
  const copia = caja.cloneNode(true);
  caja.replaceWith(copia);
};

</script>

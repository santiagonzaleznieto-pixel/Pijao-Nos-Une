name: Mantener activo Supabase

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad (docs/Analisis-Costo-Cero.md).
# Esta tarea gratuita lo consulta dos veces por semana. Usa solo la URL y la clave pública (anon) de config.json.
on:
  schedule:
    - cron: "0 13 * * 1,4"   # lunes y jueves, 8:00 a. m. en Bogotá
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultar la base
        run: |
          URL=$(python3 -c "import json;print(json.load(open('config.json'))['supabase_url'])")
          KEY=$(python3 -c "import json;print(json.load(open('config.json'))['supabase_anon_key'])")
          CODIGO=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Respuesta $CODIGO: $(cat /tmp/r.txt)"
          if [ "$CODIGO" != "200" ]; then echo "::warning::Supabase no respondió bien. Revise si el proyecto está pausado."; fi

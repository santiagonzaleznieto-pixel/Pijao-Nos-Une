name: Construir APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache \
            libltdl-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython==0.29.36

      - name: Preparar proyecto
        run: |
          mkdir -p source
          unzip -o Archivo.zip -d source
          find source -name '__MACOSX' -type d -prune -exec rm -rf {} +
          find source -name '._*' -type f -delete
          test -f source/pijao_nos_une/buildozer.spec

      - name: Construir APK
        working-directory: source/pijao_nos_une
        run: buildozer -v android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pijao-Nos-Une-APK
          path: source/pijao_nos_une/bin/*.apk
          if-no-files-found: error

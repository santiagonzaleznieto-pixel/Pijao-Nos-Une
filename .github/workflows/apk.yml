name: Construir APK Android

# Fase 1 · bloque 1.2 y hallazgo B1:
# - Antes de construir, corren las pruebas (workflow «Pruebas»).
# - Con una etiqueta vX.Y.Z se construye el APK de PRODUCCIÓN, firmado SIEMPRE con la misma llave (secretos de GitHub),
#   y se publica en GitHub Releases (descarga gratuita). Así una actualización nunca obliga a desinstalar
#   (desinstalar borraría las visitas que no se han enviado).
# - Sin etiqueta se construye un APK de prueba. Si existe el secreto ANDROID_DEBUG_KEYSTORE_B64, también queda con firma fija.
# Ningún secreto se escribe en el repositorio: todos viven en Settings → Secrets and variables → Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write   # necesario solo para publicar el APK en Releases al poner una etiqueta

jobs:
  pruebas:
    uses: ./.github/workflows/pruebas.yml

  build:
    needs: pruebas
    runs-on: ubuntu-22.04          # Ubuntu 22.04 trae justo las herramientas que usa Buildozer (la «latest» cambió y rompe la construcción)
    timeout-minutes: 90
    env:
      ES_PRODUCCION: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Versión de la app desde la etiqueta
        if: env.ES_PRODUCCION == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Versión: $VERSION"
          sed -i -E "s/^version = .*/version = $VERSION/" buildozer.spec
          sed -i -E "s/^__version__ = .*/__version__ = \"$VERSION\"/" pijao/__init__.py

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<70" wheel virtualenv

      - name: Recordar las descargas de Android (SDK y NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Firma fija para los APK de prueba
        env:
          DEBUG_KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KS" ]; then
            mkdir -p ~/.android && echo "$DEBUG_KS" | base64 -d > ~/.android/debug.keystore
            echo "Se usa la llave de prueba fija."
          else
            echo "::warning::Falta el secreto ANDROID_DEBUG_KEYSTORE_B64: este APK de prueba tendrá una firma distinta y no podrá actualizar al anterior."
          fi

      - name: Preparar la llave de producción
        if: env.ES_PRODUCCION == 'true'
        env:
          RELEASE_KS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$RELEASE_KS" ]; then
            echo "::error::Falta el secreto ANDROID_RELEASE_KEYSTORE_B64. Vea docs/Entrega-y-Firma.md"; exit 1
          fi
          echo "$RELEASE_KS" | base64 -d > "$RUNNER_TEMP/pijao-release.keystore"
          echo "P4A_RELEASE_KEYSTORE=$RUNNER_TEMP/pijao-release.keystore" >> "$GITHUB_ENV"

      - name: Construir APK
        env:
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ "$ES_PRODUCCION" = "true" ]; then MODO=release; else MODO=debug; fi
          buildozer -v android "$MODO" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Resumen del error
        if: failure()
        run: |
          {
            echo "## Por qué falló la construcción"
            if [ ! -f build.log ]; then echo "No se llegó a construir: revisa el paso que quedó en rojo."; exit 0; fi
            echo
            echo "### Líneas con errores"
            echo '```'
            grep -n -i -E "error|traceback|exception|no matching|not found|cannot|denied|failed to|fatal" build.log | grep -v -i -E "warning|0 errors" | tail -n 40 || true
            echo '```'
            echo
            echo "### Lo que pasó justo antes del aviso final"
            echo '```'
            LINEA=$(grep -n "Buildozer failed to execute the last command" build.log | head -n 1 | cut -d: -f1)
            if [ -n "$LINEA" ]; then sed -n "$((LINEA > 90 ? LINEA - 90 : 1)),${LINEA}p" build.log | grep -v "^#" | tail -n 70; else tail -n 70 build.log; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: pijao-nos-une-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar en GitHub Releases (solo producción)
        if: env.ES_PRODUCCION == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/*.apk --title "Pijao nos une $GITHUB_REF_NAME" \
            --notes "Versión $GITHUB_REF_NAME. Instale este APK encima de la versión anterior: no desinstale la app si tiene registros sin enviar."

      - name: Guardar el registro de la construcción
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-construccion
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
